name: Build Project

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild WoWFix335.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Build-Output
        path: |
          **/Release/*.exe
          **/Release/*.dll
